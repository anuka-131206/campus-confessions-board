apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-confessions-board
  namespace: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-confessions-board
  template:
    metadata:
      labels:
        app: campus-confessions-board
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: app
          image: anuka13/campus-confessions-board:stage
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://confessions:confessions@postgres:5432/confessions
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: campus-confessions-board
  namespace: stage
spec:
  type: ClusterIP
  selector:
    app: campus-confessions-board
  ports:
    - name: http
      port: 8080
      targetPort: 8080
