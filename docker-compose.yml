services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: confessions
      POSTGRES_USER: confessions
      POSTGRES_PASSWORD: confessions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confessions -d confessions"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16.4-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: confessions
      PGUSER: confessions
      PGPASSWORD: confessions
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        for file in /migrations/*.sql; do
          echo "Applying $$file"
          psql -v ON_ERROR_STOP=1 -f "$$file"
        done

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://confessions:confessions@postgres:5432/confessions
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
